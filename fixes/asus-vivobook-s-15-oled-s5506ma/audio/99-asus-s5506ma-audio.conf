# Calibración Acústica Oficial ASUS Vivobook S 15 OLED (S5506MA - SUBSYS 10433C10)
# Extraída de:
#   - DolbyAtmos: DEV_0294_SUBSYS_10433C10_PCI_SUBSYS_3C101043.xml
#   - Realtek:    RTAIODAT.DAT (Entrada 0x0a35 ASUS_3C10 - MIEQ)
#
# Funciona como Smart Filter de WirePlumber:
#   - Se activa SOLO cuando están activos los parlantes integrados (HiFi__Speaker__sink).
#   - Al conectar auriculares (HiFi__Headphones__sink), se saltea automáticamente.
#   - Con node.passive = true, consume 0% CPU y 0 batería cuando no hay audio reproduciéndose.

context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "ASUS Vivobook S15 Harman/Kardon (Dolby Atmos)"
            media.name       = "ASUS Vivobook S15 Harman/Kardon (Dolby Atmos)"
            filter.graph = {
                nodes = [
                    # 1. Protección de excursión sub-grave (<speaker-peq-filters> f0=95Hz)
                    {
                        type    = builtin
                        name    = eq_hp_sub
                        label   = bq_highpass
                        control = { "Freq" = 95.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                    # 2. Ganancia general compensada (volmax-boost / system-gain)
                    {
                        type    = builtin
                        name    = eq_preamp
                        label   = bq_highshelf
                        control = { "Freq" = 20.0 "Q" = 0.707 "Gain" = 2.2 }
                    }
                    # 3. Proyección de cuerpo / graves armónicos (virtual-bass 94..328 Hz + ieq_balanced)
                    {
                        type    = builtin
                        name    = eq_bass_warmth
                        label   = bq_peaking
                        control = { "Freq" = 210.0 "Q" = 1.1 "Gain" = 3.2 }
                    }
                    # 4. Supresión de resonancia de chasis medio-bajo (bandas 469-844 Hz: -90, -102, -59)
                    {
                        type    = builtin
                        name    = eq_box_cut1
                        label   = bq_peaking
                        control = { "Freq" = 590.0 "Q" = 1.35 "Gain" = -3.8 }
                    }
                    # 5. Supresión nasal de gabinete (banda 1313 Hz: -82)
                    {
                        type    = builtin
                        name    = eq_box_cut2
                        label   = bq_peaking
                        control = { "Freq" = 1280.0 "Q" = 1.8 "Gain" = -2.8 }
                    }
                    # 6. Claridad vocal / Dialog Enhancer (bandas 1688-2250 Hz + dialog-enhancer=5)
                    {
                        type    = builtin
                        name    = eq_dialog
                        label   = bq_peaking
                        control = { "Freq" = 2050.0 "Q" = 1.25 "Gain" = 2.2 }
                    }
                    # 7. Suavizado de estridencia media-alta (bandas 3750-5813 Hz: -46, -35, -27)
                    {
                        type    = builtin
                        name    = eq_harsh_cut
                        label   = bq_peaking
                        control = { "Freq" = 4300.0 "Q" = 1.4 "Gain" = -1.8 }
                    }
                    # 8. Presencia y definición de agudos (banda 9000 Hz: +62 -> +3.88 dB)
                    {
                        type    = builtin
                        name    = eq_treble_peak
                        label   = bq_peaking
                        control = { "Freq" = 9000.0 "Q" = 1.5 "Gain" = 3.5 }
                    }
                    # 9. Brillo y aire superior (bandas 13875-19688 Hz: +69, +88 -> +4.3 a +5.5 dB)
                    {
                        type    = builtin
                        name    = eq_air_shelf
                        label   = bq_highshelf
                        control = { "Freq" = 13500.0 "Q" = 0.707 "Gain" = 4.6 }
                    }
                ]
                links = [
                    { output = "eq_hp_sub:Out"      input = "eq_preamp:In" }
                    { output = "eq_preamp:Out"      input = "eq_bass_warmth:In" }
                    { output = "eq_bass_warmth:Out" input = "eq_box_cut1:In" }
                    { output = "eq_box_cut1:Out"    input = "eq_box_cut2:In" }
                    { output = "eq_box_cut2:Out"    input = "eq_dialog:In" }
                    { output = "eq_dialog:Out"      input = "eq_harsh_cut:In" }
                    { output = "eq_harsh_cut:Out"   input = "eq_treble_peak:In" }
                    { output = "eq_treble_peak:Out" input = "eq_air_shelf:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name           = "effect_input.asus_s5506ma_dolby"
                media.class         = Audio/Sink
                device.icon-name    = "audio-speakers"
                filter.smart        = true
                filter.smart.name   = "asus_s5506ma_dolby_speaker"
                filter.smart.target = { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name          = "effect_output.asus_s5506ma_dolby"
                node.passive       = true
                node.dont-fallback = true
                target.object      = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
            }
        }
    }
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "ASUS Vivobook S15 Digital Microphone (Realtek MIEQ)"
            media.name       = "ASUS Vivobook S15 Digital Microphone (Realtek MIEQ)"
            filter.graph = {
                nodes = [
                    # Filtro pasa-altos anti-retumbe de teclado/mesa (62 Hz)
                    {
                        type    = builtin
                        name    = mic_hp
                        label   = bq_highpass
                        control = { "Freq" = 70.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                    # Recorte MIEQ de RTAIODAT.DAT (ASUS_3C10 offset 0x0080: 4000 Hz = -300 -> -3.0 dB)
                    {
                        type    = builtin
                        name    = mic_mieq_4k
                        label   = bq_peaking
                        control = { "Freq" = 4000.0 "Q" = 1.6 "Gain" = -3.0 }
                    }
                ]
                links = [
                    { output = "mic_hp:Out" input = "mic_mieq_4k:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name    = "effect_input.asus_s5506ma_mic"
                node.passive = true
            }
            playback.props = {
                node.name           = "effect_output.asus_s5506ma_mic"
                media.class         = Audio/Source
                device.icon-name    = "audio-input-microphone"
                filter.smart        = true
                filter.smart.name   = "asus_s5506ma_realtek_mic"
                filter.smart.target = { node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source" }
            }
        }
    }
]
